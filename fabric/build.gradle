plugins { id 'com.github.johnrengelman.shadow' }

architectury {
    platformSetupLoomIde()
    fabric()
}

// Both mixin configurations share one explicit production refmap.
loom {
    mixin { defaultRefmapName.set('premapped.refmap.json') }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}
remapJar {
    dependsOn shadowJar
    inputFile.set shadowJar.archiveFile
    archiveClassifier = ''
}
jar { archiveClassifier = 'dev' }
sourcesJar {
    from project(':common').sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
