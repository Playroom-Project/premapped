name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify wrapper, tests, documentation and production jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :common:test :common:javadoc :fabric:javadoc :fabric:build
      - uses: actions/upload-artifact@v4
        with:
          name: premapped-fabric-1.20.1
          path: |
            fabric/build/libs/*-alpha.1.jar
            common/build/reports/tests/test/
