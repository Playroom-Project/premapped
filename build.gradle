plugins {
    id 'architectury-plugin' version '3.4.162'
    id 'dev.architectury.loom' version '1.7.435' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury { minecraft = rootProject.minecraft_version }

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    repositories {
        mavenCentral()
        maven { url = 'https://maven.architectury.dev/' }
    }
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'java-library'
    apply plugin: 'architectury-plugin'
    base { archivesName = "${rootProject.archives_base_name}-${project.name}" }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        // All project classes are documented; missing external Javadocs are not fatal.
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) { rename { 'LICENSE_premapped' } }
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
